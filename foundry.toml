[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./web/src/lib" }]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
